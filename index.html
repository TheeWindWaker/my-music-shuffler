<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoreBeat - Blank Slate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center">

    <!-- Pure Blank Slate State -->
    <div id="blank-slate-view" class="text-center p-8 border border-slate-800 rounded-2xl bg-slate-900/50 backdrop-blur-md max-w-md">
        <div class="w-16 h-16 bg-sky-500/10 rounded-2xl flex items-center justify-center mx-auto mb-6">
            <i data-lucide="music" class="w-8 h-8 text-sky-500"></i>
        </div>
        <h2 class="text-2xl font-bold text-white mb-2">Welcome to LoreBeat</h2>
        <p class="text-slate-400 text-sm mb-8">Your library is currently empty. Upload your first CSV playlist to begin.</p>
        
        <label class="cursor-pointer inline-flex items-center gap-2 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition shadow-lg active:scale-95">
            <i data-lucide="upload-cloud" class="w-5 h-5"></i>
            <span>Upload CSV Playlist</span>
            <input type="file" class="hidden" accept=".csv" onchange="handleFileImport(event)">
        </label>
    </div>

    <script>
        // Start completely empty
        let playlist = []; 
        let filteredTracks = [];
        let currentTrackIndex = 0;

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    // Logic to load tracks from CSV
                    playlist = results.data.filter(row => row['YouTube URL']);
                    filteredTracks = [...playlist];
                    
                    // After successful import, redirect to the main player view
                    showToast("Library loaded! Redirecting...");
                    window.location.reload(); // Simple reload to trigger main app logic with new data
                }
            });
        }

        function showToast(message) {
            console.log(message);
        }
    </script>
</body>
</html>
