// Add this updated logic to your <script> section
function handleFileImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            playlist = results.data;
            filteredTracks = [...playlist];
            
            // 1. Hide the empty state/placeholder
            document.getElementById('upload-view')?.classList.add('hidden');
            
            // 2. Render the library list
            renderLibrary();
            
            // 3. Initialize the player with the first track immediately
            if (playlist.length > 0) {
                // This assumes your loadAndPlay function is defined below
                loadAndPlay(playlist[0]); 
            }
            showToast("Library loaded successfully!");
        }
    });
}

function renderLibrary() {
    const container = document.getElementById('playlist-list');
    // Ensure the container exists before injecting HTML
    if (!container) return;
    
    container.innerHTML = playlist.map((t, i) => `
        <div class="p-3 border-b border-slate-800 hover:bg-slate-900 cursor-pointer transition" onclick="loadAndPlay(playlist[${i}])">
            <h4 class="font-bold text-sm text-white">${t['Track Name'] || 'Untitled'}</h4>
            <p class="text-xs text-slate-400">${t['Series'] || 'General'}</p>
        </div>
    `).join('');
}
